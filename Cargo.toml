[package]
name = "hnl-tool-test"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Bootstrap test runner (ADR-0089)."
license = "MIT"
repository = "https://github.com/handl-lang/tool-test"
homepage = "https://handl-lang.github.io/docs/tool-test/"
documentation = "https://handl-lang.github.io/docs/tool-test/reference/"
readme = "README.md"
keywords = ["handl", "engine", "test-runner"]
categories = ["development-tools", "compilers"]
# Git-install only: https://github.com/handl-lang/tool-test (no crates.io).
publish = false

# Workspace: the root package `hnl-tool-test` plus the absorbed
# `handl-kit-test` binding crate (moved from the kit-test repo — the Rust
# crate is test-framework machinery, not a kit; kit-test keeps only its
# kit.hnl manifest).
[workspace]
members = [".", "crates/kit-test"]

[workspace.package]
license = "MIT"
repository = "https://github.com/handl-lang/tool-test"

[dependencies]
handl-platform = { git = "https://github.com/handl-lang/host", branch = "main" }
handl-plugin-lib-handl = { git = "https://github.com/handl-lang/host", branch = "main" }
handl-language = { git = "https://github.com/handl-lang/kernel", branch = "main" }
handl-runtime = { git = "https://github.com/handl-lang/host", branch = "main" }
hnl-tool-lex-pattern = { git = "https://github.com/handl-lang/tool-lex-pattern", branch = "main" }
hnl-tool-parse = { git = "https://github.com/handl-lang/tool-parse", branch = "main" }
hnl-tool-parse-pratt = { git = "https://github.com/handl-lang/tool-parse-pratt", branch = "main" }
hnl-exec = { git = "https://github.com/handl-lang/exec", branch = "main" }
hnl-exec-tree-walk = { git = "https://github.com/handl-lang/exec-tree-walk", branch = "main" }
hnl-tool-watch = { git = "https://github.com/handl-lang/tool-watch", branch = "main" }
handl-plugin-ext-diag = { git = "https://github.com/handl-lang/host", branch = "main" }
handl-plugin-lib-scheduler = { git = "https://github.com/handl-lang/host", branch = "main" }
handl-plugin-exec-cache = { git = "https://github.com/handl-lang/host", branch = "main" }
handl-plugin-ext-refinement = { git = "https://github.com/handl-lang/host", branch = "main" }
serde = "1"
serde_json = "1"
serde_yaml = "0.9"

[dev-dependencies]
# Tests build the canonical TestKitSource from the kit — the same shape a
# host uses (ADR-0128 §0.8). Dev-only: only normal deps create the
# platform↔lang cycle.
handl-kit-prelude = { git = "https://github.com/handl-lang/host", branch = "main" }
